[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonCRO"
dynamic = ["version"]
description = "Community Recharge Oscillator"
readme = "README.md"
license = { text = "CC-BY-4.0" }
authors = [{ name = "CRO team led by Soong-Ki Kim and Sen Zhao"}]
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.20",
    "scipy>=1.8",
    "pandas>=1.3",
    "xarray>=2023.1.0",
    "matplotlib>=3.5",
    "statsmodels>=0.13",
]

[tool.setuptools.dynamic]
version = {attr = "pyCRO.__version__"}

[project.urls]
Homepage = "https://github.com/senclimate/CRO"
Documentation = "https://senclimate.github.io/CRO/python/"
Repository = "https://github.com/senclimate/CRO"
Issues = "https://github.com/senclimate/CRO/issues"

[tool.setuptools]
packages = ["pyCRO"]
include-package-data = true

[tool.setuptools.package-data]
pyCRO = [
    "table_default_fitting_method.txt",
    "data/*.mat",
    "data/*.nc",
    "data/*.png"
]